<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Sent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="card p-4 shadow-sm text-center" style="width: 400px;">
        <h3 class="mb-3">Check your inbox</h3>
        <p class="text-muted">We've emailed you instructions for setting your password. If an account exists with the email you entered, you should receive them shortly.</p>
        <a href="{% url 'login' %}" class="btn btn-secondary mt-3">Back to Login</a>
    </div>
</body>
</html>
